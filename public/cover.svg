<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Magnet Yard Scrap Rush original 3D arcade cover">
 <defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071522"/><stop offset=".55" stop-color="#112c3b"/><stop offset="1" stop-color="#271f2c"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#35e8d9" stop-opacity=".48"/><stop offset=".55" stop-color="#11c5be" stop-opacity=".12"/><stop offset="1" stop-color="#11c5be" stop-opacity="0"/></radialGradient>
  <linearGradient id="steel" x2=".6" y2="1"><stop stop-color="#d7f6fb"/><stop offset=".45" stop-color="#547b94"/><stop offset="1" stop-color="#1b364b"/></linearGradient>
  <linearGradient id="beam" x2="0" y2="1"><stop stop-color="#62f7e7" stop-opacity=".7"/><stop offset="1" stop-color="#47c5db" stop-opacity=".05"/></linearGradient>
  <linearGradient id="copper" x2="1" y2="1"><stop stop-color="#ffe39b"/><stop offset=".55" stop-color="#ffad54"/><stop offset="1" stop-color="#c25845"/></linearGradient>
  <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse"><path d="M72 0H0V72" fill="none" stroke="#4b8993" stroke-opacity=".13" stroke-width="2"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="11" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="17" flood-color="#000" flood-opacity=".6"/></filter>
 </defs>
